<svg viewBox="0 0 680 680" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>p5js Badge Monochrome</title>

  <defs>
    <clipPath id="badgeClip">
      <circle cx="340" cy="340" r="230"/>
    </clipPath>
    <clipPath id="innerClip">
      <circle cx="340" cy="340" r="210"/>
    </clipPath>
  </defs>

  <circle cx="340" cy="340" r="230" fill="none" stroke="#000000" stroke-width="14"/>

  <g clip-path="url(#badgeClip)" stroke="#000000" stroke-width="0.5" opacity="0.08" fill="none">
    <line x1="140" y1="240" x2="540" y2="240"/>
    <line x1="140" y1="290" x2="540" y2="290"/>
    <line x1="140" y1="340" x2="540" y2="340"/>
    <line x1="140" y1="390" x2="540" y2="390"/>
    <line x1="140" y1="440" x2="540" y2="440"/>
    <line x1="230" y1="110" x2="230" y2="570"/>
    <line x1="290" y1="110" x2="290" y2="570"/>
    <line x1="340" y1="110" x2="340" y2="570"/>
    <line x1="390" y1="110" x2="390" y2="570"/>
    <line x1="450" y1="110" x2="450" y2="570"/>
  </g>

  <g clip-path="url(#innerClip)">
    <!-- Teal circle -> black filled -->
    <circle cx="310" cy="295" r="62" fill="#000000" stroke="#000000" stroke-width="2.5"/>

    <!-- Triangle -> outline only -->
    <polygon points="400,240 460,370 340,370" fill="none" stroke="#000000" stroke-width="3"/>

    <!-- Square -> outline only -->
    <rect x="245" y="380" width="76" height="76" rx="5" fill="none" stroke="#000000" stroke-width="3"/>

    <!-- Small circle -> black filled -->
    <circle cx="432" cy="410" r="30" fill="#000000" stroke="#000000" stroke-width="2"/>

    <!-- Sine wave -->
    <path d="M150 475 C185 450 215 500 250 475 S315 450 350 475 S415 500 450 475 S490 450 520 475"
          fill="none" stroke="#000000" stroke-width="2" opacity="0.6"/>
  </g>

  <circle cx="340" cy="340" r="210" fill="none" stroke="#000000" stroke-width="1" opacity="0.2"/>

</svg>
